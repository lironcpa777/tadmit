  if (!YEARS_CACHE.has(o)) YEARS_CACHE.set(o, Object.keys(o).map(Number).sort((a, b) => a - b));

const nearest = (table, year) => {
  const ys = yearsOf(table);
  const y = ys.reduce((best, c) => (Math.abs(c - year) < Math.abs(best - year) || (Math.abs(c - year) === Math.abs(best - year) && c > best) ? c : best), ys[0]);

};

/* ---------- Calculator ---------- */
function calculateAnnualTax(income, pointVal, points, brackets) {
  let tax = 0, prev = 0;
  for (const [limit, rate] of brackets) {
    if (income <= prev) break;
    tax += (Math.min(income, limit) - prev) * rate;
    prev = limit;
  }
  return Math.max(0, tax - points * pointVal * 12);
}
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

function SpreadCalculator() {
  const [grant, setGrant] = useState('');
  const [exemptionPerYear, setExemption] = useState(String(nearest(GRANT_EXEMPTION, CURRENT_YEAR)));
  const [startDate, setStart] = useState('');
  const [endDate, setEndRaw] = useState('');
  /* כשמשנים את תאריך הפרישה, תקרת הפטור מתעדכנת לפי שנת הפרישה */
  const setEnd = (v) => {
    setEndRaw(v);
    const y = Number(String(v).split('-')[0]);
    if (y >= 1995 && y <= 2100) setExemption(String(nearest(GRANT_EXEMPTION, y)));
  };
  const [direction, setDirection] = useState('קדימה');
  const [startTiming, setTiming] = useState('נוכחית');
  const [pointsMode, setPointsMode] = useState('male');
  const [customPoints, setCustomPoints] = useState('2.25');
  const [creditPointValue, setPointValue] = useState(String(nearest(POINT_VALUE, CURRENT_YEAR)));
  const [currentYearIncome, setCurrentIncome] = useState('');
  const [expectedIncomes, setExpected] = useState({});

  const r = useMemo(() => {
    const g = num(grant);
    const seniority = (new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24 * 365.25);
    if (!(g > 0) || !isFinite(seniority) || seniority <= 0) return { status: 'invalid' };
    const points = pointsMode === 'male' ? 2.25 : pointsMode === 'female' ? 2.75 : num(customPoints);
    /* נקודת זיכוי: לשנה שיש לה ערך בטבלה משתמשים בו, אחרת בערך שבשדה */
    const pvOf = (y) => (POINT_VALUE[y] != null ? POINT_VALUE[y] : num(creditPointValue));
    const totalExemption = num(exemptionPerYear) * seniority;
    const taxableGrant = Math.max(0, g - totalExemption);
    const base = { g, seniority, totalExemption, taxableGrant };
    if (taxableGrant === 0) return { ...base, status: 'exempt' };

    let spreadYears, deducted = false;
    if (direction === 'אחורה') spreadYears = Math.min(Math.round(seniority), 6);
    else {
      const baseYears = Math.min(Math.round(seniority / 4), 6);
      if (startTiming === 'נוכחית') spreadYears = baseYears;
      else {
        const [, m, d] = endDate.split('-').map(Number);
        const lastQuarter = m > 9 || (m === 9 && d >= 30);
        spreadYears = lastQuarter ? baseYears : baseYears - 1;
        deducted = !lastQuarter;
      }
    }
    if (!(spreadYears > 0)) return { ...base, status: 'noSpread', deducted };

    const yearlyAmount = taxableGrant / spreadYears;
    const retirementYear = Number(endDate.split('-')[0]);
    const income0 = num(currentYearIncome);
    const b0 = nearest(BRACKETS, retirementYear), pv0 = pvOf(retirementYear);
    const taxNoSpread = calculateAnnualTax(income0 + taxableGrant, pv0, points, b0) - calculateAnnualTax(income0, pv0, points, b0);
    const rows = [];
    let totalTaxSpread = 0;
    for (let i = 0; i < spreadYears; i++) {
      const targetYear = direction === 'אחורה' ? retirementYear - i : (startTiming === 'עוקבת' ? retirementYear + 1 + i : retirementYear + i);
      const b = nearest(BRACKETS, targetYear), pv = pvOf(targetYear);
      const income = num(expectedIncomes[targetYear]);
      const extraTax = calculateAnnualTax(income + yearlyAmount, pv, points, b) - calculateAnnualTax(income, pv, points, b);
      totalTaxSpread += extraTax;
      rows.push({ i, targetYear, income, total: income + yearlyAmount, extraTax });
    }

   ===================================================================== */
const CALCULATORS = [
  { id: 'spread', title: `פריסת מס למענקי פרישה`, desc: `קיבלתם מענק פרישה? קבלו הערכה של המס עם פריסה על פני כמה שנים ובלעדיה.`, ic: IC.retire, Component: SpreadCalculator },
];

/* גישה למחשבונים רק אחרי השארת פרטים.
   פרטי הנרשמים נשלחים למייל שבאתר דרך השירות החינמי FormSubmit.
   בפעם הראשונה שמישהו נרשם, FormSubmit שולח למייל הזה הודעת אישור,
   וצריך ללחוץ בה על הכפתור לאישור. מאותו רגע כל נרשם מגיע למייל. */
const LEAD_ENDPOINT = `https://formsubmit.co/ajax/${EMAIL}`;
const ACCESS_KEY = 'ly-calc-access';
const LEAD_QUEUE_KEY = 'ly-lead-queue';

/* גישה בטוחה לאחסון הדפדפן (בגלישה בסתר הוא עלול לא לעבוד) */
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* בלי אחסון ממשיכים בלי לשמור */ } },
};
const hasAccess = () => store.get(ACCESS_KEY) === '1';
const readLeadQueue = () => { try { return JSON.parse(store.get(LEAD_QUEUE_KEY) || '[]'); } catch (e) { return []; } };

/* שליחת נרשם אחד למייל. מחזיר true רק אם FormSubmit אישר שהמייל נשלח. */
async function postLead(lead) {
  const payload = {
    'שם': lead.name,
    'טלפון': lead.phone || '-',
    'מייל': lead.email || '-',
    'מקור': `הרשמה למחשבוני הפרישה באתר`,
    'זמן הרשמה': lead.at,
    _subject: `נרשם חדש למחשבוני הפרישה: ${lead.name}`,
    _template: 'table',
    _honey: lead.honey || '',
  };
  if (lead.email) payload.email = lead.email; /* כדי שאפשר יהיה ללחוץ "השב" ישירות לנרשם */
  try {
    const res = await fetch(LEAD_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json().catch(() => ({}));
    return res.ok && String(data.success) === 'true';
  } catch (e) {
    return false;
  }
}

/* אם השליחה נכשלה (אין אינטרנט, השירות לא זמין או עדיין לא אושר), הנרשם נשמר וננסה שוב בביקור הבא */
async function sendLead(lead) {
  if (await postLead(lead)) return true;
  store.set(LEAD_QUEUE_KEY, JSON.stringify([...readLeadQueue(), lead]));
  return false;
}
async function flushLeadQueue() {
  const queue = readLeadQueue();
  if (!queue.length) return;
  const left = [];
  for (const lead of queue) if (!(await postLead(lead))) left.push(lead);
  store.set(LEAD_QUEUE_KEY, JSON.stringify(left));
}

function validateLead({ name, phone, email }) {
  const phoneOk = /^(\+972|0)\d{8,9}$/.test(phone), emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if (name.length < 2) return `נא למלא שם מלא.`;
  if ((phone && !phoneOk) || (email && !emailOk)) return `נא לבדוק את מספר הטלפון או את כתובת המייל.`;
  if (!phoneOk && !emailOk) return `נא למלא טלפון או כתובת מייל.`;
  return '';
}

function CalcGate({ onUnlock }) {
  const [f, setF] = useState({ name: '', phone: '', email: '', honey: '' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

    e.preventDefault();
    const lead = { name: f.name.trim(), phone: f.phone.replace(/[\s-]/g, ''), email: f.email.trim(), honey: f.honey, at: new Date().toLocaleString('he-IL') };
    const problem = validateLead(lead);
    if (problem) return setErr(problem);
    setErr(''); setBusy(true);
    await sendLead(lead); /* הגישה נפתחת גם אם השליחה נכשלה; הנרשם נשמר לניסיון חוזר */
    store.set(ACCESS_KEY, '1');
    setBusy(false);
    onUnlock();
  };
  return (
    <form onSubmit={submit} noValidate className="bg-goldbg rounded-2xl p-6 md:p-8 flex flex-col gap-5">

        <div>

          <p className="text-ink2 text-[.95rem] mt-1">השאירו שם וטלפון או מייל, והמחשבונים ייפתחו מיד.</p>

      </div>

        <div><label className="lbl" htmlFor="g-name">שם מלא</label><input id="g-name" className="field" autoComplete="name" value={f.name} onChange={up('name')} /></div>
        <div><label className="lbl" htmlFor="g-phone">טלפון</label><input id="g-phone" className="field" type="tel" autoComplete="tel" dir="ltr" style={{ textAlign: 'right' }} value={f.phone} onChange={up('phone')} /></div>
        <div><label className="lbl" htmlFor="g-email">מייל</label><input id="g-email" className="field" type="email" autoComplete="email" dir="ltr" style={{ textAlign: 'right' }} value={f.email} onChange={up('email')} /></div>
      </div>
      {/* מלכודת לרובוטים: שדה נסתר שאנשים לא רואים. אם מולא, FormSubmit מתעלם מההרשמה. */}
      <input type="text" name="_honey" tabIndex={-1} autoComplete="off" aria-hidden="true" value={f.honey} onChange={up('honey')} style={{ position: 'absolute', left: '-9999px', width: 1, height: 1, opacity: 0 }} />
      {err && <div role="alert" className="font-bold text-navy">{err}</div>}
      <div className="flex flex-wrap items-center gap-4">
        <button type="submit" className="btn-wa btn-lg" disabled={busy}>{busy ? `שולחים...` : `קבלת גישה למחשבונים`}</button>
        <p className="text-ink2 text-[.85rem]" style={{ flex: '1 1 240px' }}>הפרטים ישמשו רק ליצירת קשר איתכם.</p>
      </div>
    </form>
  );
}

function CalculatorsHub() {
  const [unlocked, setUnlocked] = useState(hasAccess);
  const [active, setActive] = useState(null);
  const current = CALCULATORS.find((c) => c.id === active);
  return (
    <div id="calculators" className="mt-12">
      <H3 className="no-print">מחשבונים לפורשים</H3>
      {!unlocked ? <CalcGate onUnlock={() => { setUnlocked(true); setActive(CALCULATORS[0].id); }} /> : (
        <React.Fragment>
          <div className="grid sm:grid-cols-2 gap-4 mb-6 no-print">
            {CALCULATORS.map((c) => (
              <button key={c.id} onClick={() => setActive(active === c.id ? null : c.id)} aria-expanded={active === c.id}
                className={`flex items-start gap-4 p-5 text-right rounded-2xl border transition-colors ${active === c.id ? 'bg-goldbg border-gold' : 'bg-page border-line hover:border-blue hover:bg-soft'}`}>
                <span className="w-12 h-12 shrink-0 rounded-full bg-white border border-line text-blue flex items-center justify-center"><Svg>{c.ic}</Svg></span>
                <span className="flex-1">
                  <span className="block font-bold text-navy text-[1.1rem] leading-snug">{c.title}</span>
                  <span className="block text-ink2 text-[.9rem] leading-normal mt-1">{c.desc}</span>
                  <span className="block text-blue font-bold text-[.9rem] mt-2">{active === c.id ? `סגירת המחשבון` : `פתיחת המחשבון`}</span>

/* ---------- Why ---------- */
function Why() {
  const items = [

    [`הכול דיגיטלי ופשוט`, `מצלמים, שולחים בוואטסאפ או במייל, וזהו. פתיחת תיקים ודיווחים נעשים מרחוק, בלי להגיע למשרד.`, <path d="M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2"/>],
    [`מקצועיות וניסיון של יותר מ-10 שנים`, `רואת חשבון מוסמכת ומתכננת מיסוי בפרישה, עם ניסיון מעשי בעסקים קטנים, בדוחות שנתיים, בהחזרי מס ובתיקי פרישה.`, <path d="M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM8.5 12.5 7 21l5-3 5 3-1.5-8.5"/>],
    [`שפה פשוטה וזמינות אישית`, `בלי בירוקרטיה ובלי מילים מסובכות. יש שאלה? שולחים וואטסאפ ומקבלים ממני מענה אישי.`, <path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.5-5.4A8.5 8.5 0 1 1 21 12z"/>],
  ];
  return (
    <section id="why" className="py-14 md:py-20 no-print">
      <div className="wrap">
        <H2>למה לבחור בי</H2>
        <div className="grid md:grid-cols-2 gap-6">
          {items.map(([t, d, p]) => (
            <div key={t} className="card p-7 flex gap-5">
              <span className="w-12 h-12 shrink-0 rounded-full bg-goldbg text-golddk flex items-center justify-center"><Svg>{p}</Svg></span>
              <div><h3 className="font-bold text-[1.2rem] leading-snug mb-2">{t}</h3><p className="text-ink2">{d}</p></div>

/* ---------- FAQ ---------- */
const FAQS = [
  [`איך שולחים את המסמכים בהנהלת חשבונות דיגיטלית?`, `הכי פשוט: מצלמים את החשבונית ושולחים בוואטסאפ או במייל. מיד מקבלים אישור אוטומטי שהמסמך התקבל, ואין צורך להגיע למשרד.`],
  [`יש לי כבר רואה חשבון. מסובך לעבור? ואפשר להזמין רק דוח שנתי?`, `לא מסובך בכלל. המעבר נעשה בצורה מסודרת, ואני מלווה אתכם בכל שלב. אפשר גם להזמין רק הכנה והגשה של הדוח השנתי, בלי הנהלת חשבונות שוטפת.`],
  [`מה ההבדל בין עוסק פטור לעוסק מורשה?`, `עוסק פטור לא גובה מע״מ מהלקוחות, לא מקזז מע״מ על ההוצאות ומוציא קבלות. עוסק מורשה גובה מע״מ, מקזז את המע״מ על הוצאות העסק ומוציא חשבוניות מס. מי שעובר את תקרת המחזור השנתית, או עוסק במקצוע שמחייב זאת, חייב להירשם כעוסק מורשה. הפירוט המלא נמצא בלשונית "הנהלת חשבונות ודוחות שנתיים לעוסקים מורשים ופטורים".`],
  [`אני שכיר. איך יודעים אם מגיע לי החזר מס?`, `החזר מס יכול לנבוע מסיבות רבות, למשל עבודה בחלק מהשנה, חופשת לידה, סיום תואר או תרומות. אפשר לדרוש החזר עד 6 שנים אחורה. שלחו הודעה ונבדוק יחד.`],
  [`מה זה קיבוע זכויות, ולמה זה חשוב?`, `זה ההליך שבו בוחרים איך לנצל את הפטור ממס שמגיע על קצבה, אחרי שמגיעים לגיל הפרישה. הבחירה מושפעת ממענקים שקיבלתם בעבר, והיא קובעת כמה מס תשלמו לאורך שנים.`],
  [`איפה נפגשים?`, `איך שנוח לכם. את כל השירותים אפשר לקבל באופן דיגיטלי, מכל מקום בארץ, או בפגישה פרונטלית במשרד, ברחוב התע״ש 20 בכפר סבא. אפשר גם להיפגש בזום.`],
];

/* ---------- Contact ---------- */
const TOPICS = [`הנהלת חשבונות שוטפת`, `דוח שנתי`, `פתיחת תיק עוסק פטור או מורשה`, `החזר מס לשכירים`, `ייעוץ מיסוי בפרישה וקיבוע זכויות`, `עזיבת עבודה ופריסת פיצויים`];
const ContactRow = ({ icon, children }) => (

);

    <section id="contact" className="bg-soft border-t border-line py-14 md:py-20 no-print">
      <div className="wrap">
        <H2 className="!mb-3 max-w-[860px]">יש לכם שאלה על העסק, על החזר מס או על הפרישה? דברו איתי</H2>
        <p className="text-ink2 text-[1.1rem] mb-10">פגישות נקבעות בתיאום אישי, בוואטסאפ או בטלפון.</p>
        <div className="grid lg:grid-cols-2 gap-8 items-start">
          <div className="card p-7 md:p-9 flex flex-col gap-6">

            <ContactRow icon={<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>}>
              <a href="tel:0553066401" className="inline-block py-1 text-navy font-bold text-[1.2rem] no-underline hover:text-blue" dir="ltr">{PHONE}</a>
            </ContactRow>
            <ContactRow icon={<path d="M3 6h18v12H3zM3 7l9 6 9-6"/>}>
              <a href={`mailto:${EMAIL}`} className="text-navy font-medium no-underline hover:text-blue break-all" dir="ltr">{EMAIL}</a>
            </ContactRow>
            <ContactRow icon={<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>}>התע״ש 20, כפר סבא (או בפגישת זום)</ContactRow>
          </div>

          <form onSubmit={submit} className="card p-7 md:p-9 flex flex-col gap-4" style={{ borderTop: '5px solid #B8975A' }}>
            <div className="font-bold text-navy text-[1.3rem]">השאירו פנייה קצרה</div>

            <div><label className="lbl" htmlFor="f-phone">טלפון</label><input id="f-phone" className="field" type="tel" required autoComplete="tel" dir="ltr" style={{ textAlign: 'right' }} value={f.phone} onChange={up('phone')} /></div>
            <div><label className="lbl" htmlFor="f-topic">נושא הפנייה</label>

            <div><label className="lbl" htmlFor="f-msg">הודעה קצרה</label><textarea id="f-msg" className="field" rows="3" value={f.msg} onChange={up('msg')}></textarea></div>

          </form>
        </div>
      </div>
    </section>
  );

function Footer() {
  return (
    <footer className="bg-navy text-[.85rem] no-print" style={{ color: '#D5DAE3' }}>
      <div className="wrap py-7 pb-24 flex flex-wrap gap-x-3 gap-y-1 justify-center text-center">

        <span>טלפון: <a href="tel:0553066401" className="text-inherit" dir="ltr">{PHONE}</a></span><span aria-hidden="true">|</span>
        <span>אימייל: <a href={`mailto:${EMAIL}`} className="text-inherit" dir="ltr">{EMAIL}</a></span><span aria-hidden="true">|</span>
        <span>המידע באתר כללי ואינו מהווה ייעוץ מותאם אישית.</span>
      </div>

}

/* קישור ישיר ללשונית: למשל ...html#retire פותח את לשונית הפרישה.
   ‎#patur או ‎#murshe פותחים את לשונית הנהלת החשבונות, ישר בהסבר על סוג העסק.
   הכתובת בשורת הדפדפן מתעדכנת גם כשלוחצים, כך שאפשר להעתיק ולשתף אותה. */
const BIZ_KINDS = ['patur', 'murshe'];
const hashSlug = () => location.hash.slice(1);
const tabIndexFromHash = () => TABS.findIndex((t) => t.slug === (BIZ_KINDS.includes(hashSlug()) ? 'books' : hashSlug()));
const setHash = (slug) => { try { history.replaceState(null, '', `#${slug}`); } catch (e) { /* בלי עדכון כתובת, התוכן עדיין מתחלף */ } };
const scrollToHashTarget = (smooth = true) => scrollToId(BIZ_KINDS.includes(hashSlug()) ? 'biz-type' : 'services', smooth);

function App() {
  const [tab, setTab] = useState(() => Math.max(0, tabIndexFromHash()));
  const selectTab = (i, scroll = false) => {
    setTab(i);
    setHash(TABS[i].slug);
    if (scroll) setTimeout(() => scrollToId('services'), 30);
  };
  const goTab = (i) => selectTab(i, true);
  React.useEffect(() => {
    flushLeadQueue();
    if (tabIndexFromHash() >= 0) setTimeout(() => scrollToHashTarget(false), 300);
    const onHash = () => {
      const i = tabIndexFromHash();
      if (i < 0) return;
      setTab(i);
      setTimeout(scrollToHashTarget, 30);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return (
    <React.Fragment>
      <Header />
      <main>
        <Hero goTab={goTab} />
        <Trust />
        <Services tab={tab} selectTab={selectTab} />
        <Why />
        <Faq />
        <Contact />
      </main>
      <Footer />
      <a href={WA_GENERAL} target="_blank" rel="noopener" className="btn-wa no-print fixed left-4 bottom-4 z-50 min-h-[3rem] px-5 text-[.95rem]" style={{ boxShadow: '0 6px 18px rgba(27,42,74,.25)' }}>
        <WaIcon s={24} /><span>וואטסאפ</span>
      </a>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
